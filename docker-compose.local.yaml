services:
  backend:
    image: care_local
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
      args:
        ADDITIONAL_PLUGS: ${ADDITIONAL_PLUGS:-}
    env_file:
      - ./docker/.local.env
    environment:
      DRAFT_RECOVERY_WRAPPING_KEYS_FILE: /run/secrets/care-draft-recovery-keys.json
    volumes:
      - .:/app
      - ../.local-secrets/draft-recovery-keyring.json:/run/secrets/care-draft-recovery-keys.json:ro
    entrypoint: ["bash", "scripts/start-dev.sh"]
    ports:
      - "9000:9000"
      - "9876:9876" #debugpy
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      celery:
        condition: service_healthy

  celery:
    image: care_local
    env_file:
      - ./docker/.local.env
    entrypoint: ["bash", "scripts/celery-dev.sh"]
    restart: unless-stopped
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
