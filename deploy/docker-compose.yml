# CARE Suriname — production stack.
#
# Builds the backend and frontend from THIS checkout (not the upstream CARE
# images, which do not contain the Suriname migrations, plugs or the urology
# frontend). Expects the standard layout:
#
#   <root>/care/      this repository (backend)
#   <root>/care_fe/   the frontend repository, sibling of care/
#
# Usage, from <root>/care/deploy:
#
#   bash make-env.sh care.example.sr     # once: writes .env with fresh secrets
#   docker compose build                 # backend, ~15 min the first time
#   bash care/deploy/ship-frontend.sh    # from the laptop: the frontend image
#   docker compose up -d
#
# Only Caddy publishes ports (80/443). Postgres, Redis, MinIO and the Django
# API are reachable solely on the internal network. See README.md.

name: care-suriname

networks:
  default:
    name: care-suriname

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:

# Docker keeps container logs forever by default; cap each at 5 x 20 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-backend: &backend
  image: care-suriname-backend:${APP_VERSION:-local}
  build:
    context: ..
    dockerfile: docker/prod.Dockerfile
    args:
      APP_VERSION: ${APP_VERSION:-local}
  env_file: .env
  restart: unless-stopped
  logging: *logging
  volumes:
    # Draft-recovery keyring (care_suriname/draft_recovery/README.md). Unset,
    # /dev/null is mounted and recovery stays unavailable, as intended.
    - ${DRAFT_RECOVERY_KEYS_HOST_FILE:-/dev/null}:/run/secrets/care-draft-recovery-keys.json:ro

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${BACKUP_DIR:-./backups}:/backups
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging: *logging
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    logging: *logging
    environment:
      MINIO_ROOT_USER: ${BUCKET_KEY}
      MINIO_ROOT_PASSWORD: ${BUCKET_SECRET}
      MINIO_ACCESS_KEY: ${BUCKET_KEY}
      MINIO_SECRET_KEY: ${BUCKET_SECRET}
      AWS_DEFAULT_REGION: ${BUCKET_REGION}
    volumes:
      - minio-data:/data
      - ../docker/minio/init-script.sh:/init-script.sh:ro
      - ../docker/minio/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s

  # Runs migrations, then the scheduler. backend and celery-worker wait for
  # its health file so they never start against an unmigrated database.
  celery-beat:
    <<: *backend
    entrypoint: ["bash", "celery_beat.sh"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 10s
      retries: 60
      start_period: 30s
      timeout: 5s

  celery-worker:
    <<: *backend
    entrypoint: ["bash", "celery_worker.sh"]
    depends_on:
      celery-beat:
        condition: service_healthy

  backend:
    <<: *backend
    entrypoint: ["bash", "start.sh"]
    depends_on:
      celery-beat:
        condition: service_healthy
    expose:
      - "9000"

  # Built on the laptop and shipped as an image by ship-frontend.sh, never
  # here: the 4 GB server cannot build it while serving, and only that script
  # sets every build-time setting (e.g. the letter download host).
  frontend:
    image: care-suriname-frontend:${APP_VERSION:-local}
    restart: unless-stopped
    logging: *logging
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      CARE_DOMAIN: ${CARE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - frontend
      - minio
